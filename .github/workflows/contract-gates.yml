name: Contract Gates

concurrency:
  group: contract-gates-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  workflow_dispatch:
    inputs:
      gate:
        description: 'Contract gate profile to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - release-candidate
          - module-certification
      evidence_dir:
        description: 'Optional evidence directory override for a single selected gate'
        required: false
        default: ''
      run_commands:
        type: choice
        description: 'Execute representative gate test commands'
        required: true
        default: 'true'
        options:
          - 'true'
          - 'false'
      allow_missing_evidence:
        type: choice
        description: 'Allow missing evidence files (for dry-run validation only)'
        required: true
        default: 'false'
        options:
          - 'true'
          - 'false'
  workflow_call:
    inputs:
      gate:
        description: 'Contract gate profile to run'
        required: false
        default: 'all'
        type: string
      evidence_dir:
        description: 'Optional evidence directory override for a single selected gate'
        required: false
        default: ''
        type: string
      run_commands:
        description: 'Execute representative gate test commands'
        required: false
        default: 'true'
        type: string
      allow_missing_evidence:
        description: 'Allow missing evidence files (for dry-run validation only)'
        required: false
        default: 'false'
        type: string

permissions:
  contents: read

jobs:
  contract-tests:
    name: Contract validator behavior
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js 26.7.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.7.0'

      - name: Run contract validator tests
        run: node --test scripts/release-gates/__tests__/*.test.js scripts/boundary-guards/__tests__/*.test.js

  contract-gates:
    name: ${{ matrix.label }}
    runs-on: ${{ fromJSON(vars.SELF_LINUX_LABELS || '"ubuntu-latest"') }}
    timeout-minutes: 60
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - gate: release-candidate
            label: Release Candidate Contract Gates
            profile: scripts/release-gates/rc-contract-profile.json
            evidence_dir: docs/super-app-rfc-adr/evidence/release-candidate/current
          - gate: module-certification
            label: Module Certification Gates
            profile: scripts/release-gates/module-certification-profile.json
            evidence_dir: docs/super-app-rfc-adr/evidence/module-certification/current
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve gate inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          SELECTED_GATE: ${{ inputs.gate || github.event.inputs.gate || 'all' }}
          EVIDENCE_DIR_INPUT: ${{ inputs.evidence_dir || github.event.inputs.evidence_dir || '' }}
          DEFAULT_EVIDENCE_DIR: ${{ matrix.evidence_dir }}
          GATE_ID: ${{ matrix.gate }}
          RUN_COMMANDS_INPUT: ${{ inputs.run_commands || github.event.inputs.run_commands || '' }}
          ALLOW_MISSING_EVIDENCE_INPUT: ${{ inputs.allow_missing_evidence || github.event.inputs.allow_missing_evidence || 'false' }}
        run: |
          case "$SELECTED_GATE" in
            all|release-candidate|module-certification)
              ;;
            *)
              echo "Unknown contract gate profile: $SELECTED_GATE"
              exit 1
              ;;
          esac

          if [ "$EVENT_NAME" != "pull_request" ] && [ "$SELECTED_GATE" != "all" ] && [ "$SELECTED_GATE" != "$GATE_ID" ]; then
            echo "skip_gate=true" >> "$GITHUB_ENV"
            exit 0
          fi

          if [ "$EVENT_NAME" != "pull_request" ] && [ "$SELECTED_GATE" = "all" ] && [ -n "$EVIDENCE_DIR_INPUT" ]; then
            echo 'evidence_dir can only be overridden when a single gate is selected.'
            exit 1
          fi

          RUN_COMMANDS="$RUN_COMMANDS_INPUT"
          if [ -z "$RUN_COMMANDS" ]; then
            RUN_COMMANDS="true"
          fi

          EVIDENCE_DIR="$DEFAULT_EVIDENCE_DIR"
          if [ -n "$EVIDENCE_DIR_INPUT" ]; then
            EVIDENCE_DIR="$EVIDENCE_DIR_INPUT"
          fi

          {
            echo "skip_gate=false"
            echo "run_commands=$RUN_COMMANDS"
            echo "evidence_dir=$EVIDENCE_DIR"
            echo "allow_missing_evidence=$ALLOW_MISSING_EVIDENCE_INPUT"
          } >> "$GITHUB_ENV"

      # Manual validation-only runs do not install dependencies or claim qualification.
      - name: Setup mise
        if: env.skip_gate != 'true' && env.run_commands == 'true'
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.3
          install: true

      - name: Setup Node.js 26.7.0
        if: env.skip_gate != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.7.0'

      - name: Install Dependencies
        if: env.skip_gate != 'true' && env.run_commands == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build Required Pkg
        if: env.skip_gate != 'true' && env.run_commands == 'true'
        run: pnpm run build:required

      - name: Validate Contract Gate
        if: env.skip_gate != 'true'
        env:
          GATE_PROFILE: ${{ matrix.profile }}
        run: |
          ARGS=(
            --profile "$GATE_PROFILE"
            --evidence-dir "$evidence_dir"
          )

          if [ "$allow_missing_evidence" = "true" ]; then
            ARGS+=(--allow-missing-evidence)
          fi

          if [ "$run_commands" = "false" ]; then
            ARGS+=(--skip-commands)
          fi

          node scripts/release-gates/validate-release-candidate-gates.js "${ARGS[@]}"

  contract-gates-summary:
    name: Contract Gates Summary
    runs-on: ubuntu-latest
    if: always()
    needs:
      - contract-tests
      - contract-gates
    timeout-minutes: 5
    steps:
      - name: Check selected validation result
        env:
          EVENT_NAME: ${{ github.event_name }}
          TEST_RESULT: ${{ needs.contract-tests.result }}
          GATE_RESULT: ${{ needs.contract-gates.result }}
          RUN_COMMANDS: ${{ inputs.run_commands || github.event.inputs.run_commands || 'true' }}
          ALLOW_MISSING_EVIDENCE: ${{ inputs.allow_missing_evidence || github.event.inputs.allow_missing_evidence || 'false' }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            [ "$TEST_RESULT" = "success" ] || exit 1
            echo 'Contract validator behavior tests passed; release qualification was not run.'
          else
            [ "$GATE_RESULT" = "success" ] || exit 1
            if [ "$RUN_COMMANDS" = "false" ] || [ "$ALLOW_MISSING_EVIDENCE" = "true" ]; then
              echo 'Profile validation completed; release qualification was not performed.'
            else
              echo 'Selected contract gates executed and qualified.'
            fi
          fi
